<div class="card h-100 shadow-lg border-0 rounded-3 overflow-hidden bg-light">
    @if(image()){
        <div>
            <img [src]="image()" [alt]="codiceStudente()" class="img-wrapper">
        </div>
    }
    <div class="card-body">
        <h4 class="card-title text-navy text-center">{{ codiceStudente() }}</h4>

        <p class="card-text text-end">
            <span class="badge voto-badge">Voto: {{ voto() }}</span>
        </p>

        <button class="btn btn-navy btn-sm mt-2 rounded-3 shadow" (click)="selezionato.emit()"> Dettaglio </button>
    </div>
</div>
