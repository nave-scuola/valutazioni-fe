<form [formGroup]="filtroForm" (ngSubmit)="onSubmit()" class="card card-body mb-3">
  <div class="row g-2 align-items-end">

    <div class="col-md-4">
      <label class="form-label">Studente</label>
      <input formControlName="studente" class="form-control" placeholder="Cerca studente">
    </div>

    <div class="col-md-4">
      <label class="form-label">Voto</label>
      <input formControlName="voto" class="form-control" placeholder="Cerca voto">
    </div>

    <div class="col-md-4">
      <label class="form-label">Data</label>
      <input formControlName="data" type="date" class="form-control">
    </div>

    <div class="col-12 d-flex align-items-center mt-2">

      <div class="d-flex">
        <button type="submit" class="btn btn-navy">Filtra</button>
        <button type="button" class="btn btn-outline-secondary ms-2" (click)="onReset()">Reset</button>
      </div>

      <a routerLink="nuova" class="btn btn-nuovo ms-auto">
        Nuova valutazione
      </a>

    </div>

  </div>
</form>
